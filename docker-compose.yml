services:
  backend:
    build:
      context: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      SECURITY_ROOT: /security
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      # Keep the SQLite database file on your machine while developing.
      - ./backend:/app
      # Mount the protected security engine so the backend can read policies
      # and write audit logs without copying or modifying security code.
      - ./security:/security
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7
    ports:
      - "6379:6379"
